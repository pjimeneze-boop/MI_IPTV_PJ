name: Actualizar listas IPTV

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días, 5:17 a.m. hora de Lima
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar listas
        run: python build.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listas
          git diff --cached --quiet || git commit -m "Listas actualizadas $(date -u +%F)"
          git push
